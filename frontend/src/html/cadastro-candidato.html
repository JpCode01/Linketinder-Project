<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Linketinder | Cadastro de Candidato</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

<main class="auth-container">

    <section class="auth-brand">

        <div class="brand-logo">
            <span>Link</span><strong>etinder</strong>
        </div>

        <h1>
            Seu próximo match<br>
            <span>profissional começa aqui.</span>
        </h1>

        <p>
            Crie seu perfil e encontre oportunidades
            compatíveis com suas competências.
        </p>

    </section>

    <section class="auth-card register-card">

        <div class="card-header">

            <span class="section-label">
                CADASTRO DE CANDIDATO
            </span>

            <h2>Criar conta</h2>

            <p>
                Preencha seus dados para começar.
            </p>

        </div>

        <form id="candidate-registration-form">

            <div class="input-group">
                <label for="name">Nome</label>

                <input
                    type="text"
                    id="name"
                    name="nome"
                    placeholder="Digite seu nome"
                    autocomplete="given-name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="surname">Sobrenome</label>

                <input
                    type="text"
                    id="surname"
                    name="sobrenome"
                    placeholder="Digite seu sobrenome"
                    autocomplete="family-name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Senha</label>

                <input
                    type="password"
                    id="password"
                    name="senha"
                    placeholder="Crie sua senha"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="input-group">
                <label for="cpf">CPF</label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="Digite seu CPF"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="input-group">
                <label for="birth-date">Data de nascimento</label>

                <input
                    type="date"
                    id="birth-date"
                    name="dataNascimento"
                    autocomplete="bday"
                    required
                >
            </div>

            <div class="input-group">
                <label for="country">País</label>

                <select
                    id="country"
                    name="pais"
                    required
                >
                    <option value="">Carregando países...</option>
                </select>
            </div>

            <div class="input-group">
                <label for="state">Estado</label>

                <select
                    id="state"
                    name="estado"
                    required
                >
                    <option value="">Selecione um estado</option>
                </select>
            </div>

            <div class="input-group">
                <label for="cep">CEP</label>

                <input
                    type="text"
                    id="cep"
                    name="cep"
                    placeholder="00000-000"
                    autocomplete="postal-code"
                    required
                >
            </div>

            <div class="input-group">
                <span class="skills-title">Competências</span>

                <div
                    id="skills-options"
                    class="skills-options"
                ></div>
            </div>

            <div class="input-group">
                <label for="description">Descrição</label>

                <textarea
                    id="description"
                    name="descricao"
                    rows="4"
                    placeholder="Conte um pouco sobre você..."
                    required
                ></textarea>
            </div>

            <button
                type="button"
                id="register-candidate"
                class="btn btn-primary"
            >
                Criar minha conta
            </button>

            <p
                id="registration-error"
                role="alert"
                aria-live="polite"
                hidden
            ></p>

            <p class="login-link">
                Já possui uma conta?

                <a href="./index.html">Entrar</a>
            </p>

        </form>

    </section>

</main>

<script src="../js/bundle.js"></script>

</body>
</html>
