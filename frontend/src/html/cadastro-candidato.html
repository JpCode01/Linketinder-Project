<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Linketinder | Cadastro de Candidato</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="auth-page">

<main class="auth-container">


    <section class="auth-brand">

        <div class="brand-logo">
            <span>Link</span><strong>etinder</strong>
        </div>

        <h1>
            Seu próximo match<br>
            <span>profissional começa aqui.</span>
        </h1>

        <p>
            Crie seu perfil e encontre oportunidades
            compatíveis com suas competências.
        </p>

    </section>


    <section class="auth-card register-card">

        <div class="card-header">

            <span class="section-label">
                CADASTRO DE CANDIDATO
            </span>

            <h2>
                Criar conta
            </h2>

            <p>
                Preencha seus dados para começar.
            </p>

        </div>


        <form>

            <div class="input-group">

                <label for="name">
                    Nome
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Digite seu nome"
                >

            </div>


            <div class="input-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                >

            </div>


            <div class="input-group">

                <label for="cpf">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    placeholder="Digite seu CPF"
                >

            </div>


            <div class="input-group">

                <label for="age">
                    Idade
                </label>

                <input
                    type="number"
                    id="age"
                    placeholder="Digite sua idade"
                >

            </div>


            <div class="input-group">

                <label for="education">
                    Formação
                </label>

                <input
                    type="text"
                    id="education"
                    placeholder="Ex: Engenharia de Software"
                >

            </div>


            <div class="input-group">

                <label for="skills">
                    Competências
                </label>

                <input
                    type="text"
                    id="skills"
                    placeholder="Ex: Java, Python, SQL"
                >

            </div>


            <div class="input-group">

                <label for="state">
                    Estado
                </label>

                <input
                    type="text"
                    id="state"
                    placeholder="Ex: São Paulo"
                >

            </div>


            <div class="input-group">

                <label for="cep">
                    CEP
                </label>

                <input
                    type="text"
                    id="cep"
                    placeholder="00000-000"
                >

            </div>


            <div class="input-group">

                <label for="description">
                    Descrição
                </label>

                <textarea
                    id="description"
                    rows="4"
                    placeholder="Conte um pouco sobre você..."
                ></textarea>

            </div>


            <button
                type="button"
                id="register-candidate"
                class="btn btn-primary"
            >
                Criar minha conta
            </button>


            <p class="login-link">

                Já possui uma conta?

                <a href="./index.html">
                    Entrar
                </a>

            </p>


        </form>

    </section>

</main>

<script src="../js/bundle.js"></script>

</body>
</html>
