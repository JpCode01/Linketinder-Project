<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Linketinder | Cadastro de Empresa</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="auth-page">

<main class="auth-container">


    <section class="auth-brand">

        <div class="brand-logo">
            <span>Link</span><strong>etinder</strong>
        </div>

        <h1>
            Encontre os melhores<br>
            <span>talentos para sua empresa.</span>
        </h1>

        <p>
            Crie o perfil da sua empresa e encontre
            candidatos compatíveis com suas necessidades.
        </p>

    </section>


    <section class="auth-card register-card">

        <div class="card-header">

            <span class="section-label">
                CADASTRO DE EMPRESA
            </span>

            <h2>
                Criar conta
            </h2>

            <p>
                Preencha os dados da sua empresa para começar.
            </p>

        </div>


        <form>

            <div class="input-group">

                <label for="name">
                    Nome da empresa
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Digite o nome da empresa"
                >

            </div>


            <div class="input-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="empresa@email.com"
                >

            </div>


            <div class="input-group">

                <label for="cnpj">
                    CNPJ
                </label>

                <input
                    type="text"
                    id="cnpj"
                    placeholder="Digite o CNPJ"
                >

            </div>


            <div class="input-group">

                <label for="country">
                    País
                </label>

                <input
                    type="text"
                    id="country"
                    placeholder="Ex: Brasil"
                >

            </div>


            <div class="input-group">

                <label for="state">
                    Estado
                </label>

                <input
                    type="text"
                    id="state"
                    placeholder="Ex: São Paulo"
                >

            </div>


            <div class="input-group">

                <label for="cep">
                    CEP
                </label>

                <input
                    type="text"
                    id="cep"
                    placeholder="00000-000"
                >

            </div>


            <div class="input-group">

                <label for="description">
                    Descrição
                </label>

                <textarea
                    id="description"
                    rows="4"
                    placeholder="Conte um pouco sobre a empresa..."
                ></textarea>

            </div>


            <button
                type="button"
                id="register-company"
                class="btn btn-primary"
            >
                Criar minha conta
            </button>


            <p class="login-link">

                Já possui uma conta?

                <a href="./index.html">
                    Entrar
                </a>

            </p>


        </form>

    </section>

</main>

<script src="../js/bundle.js"></script>

</body>
</html>
