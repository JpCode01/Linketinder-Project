<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Linketinder | Cadastro</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="auth-page">

<main class="auth-container">


    <section class="auth-brand">

        <div class="brand-logo">
            <span>Link</span><strong>etinder</strong>
        </div>

        <h1>
            Seu próximo match<br>
            <span>profissional começa aqui.</span>
        </h1>

        <p>
            Crie seu perfil e encontre oportunidades
            compatíveis com suas competências.
        </p>

    </section>


    <section class="auth-card register-card">

        <div class="card-header">

            <span class="section-label">
                CADASTRO
            </span>

            <h2 id="register-title">
                Criar conta
            </h2>

            <p id="register-description">
                Preencha seus dados para começar.
            </p>

        </div>


        <form>


            <div class="input-group">

                <label for="name">
                    Nome
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Digite seu nome"
                >

            </div>


            <div class="input-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Crie uma senha"
                >

            </div>


            <div id="candidate-fields">


                <div class="input-group">

                    <label for="education">
                        Formação
                    </label>

                    <input
                        type="text"
                        id="education"
                        placeholder="Ex: Engenharia de Software"
                    >

                </div>


                <div class="input-group">

                    <label for="skills">
                        Competências
                    </label>

                    <input
                        type="text"
                        id="skills"
                        placeholder="Ex: Java, Python, SQL"
                    >

                </div>

            </div>


            <div id="company-fields" class="hidden">


                <div class="input-group">

                    <label for="company">
                        Nome da empresa
                    </label>

                    <input
                        type="text"
                        id="company"
                        placeholder="Nome da empresa"
                    >

                </div>


                <div class="input-group">

                    <label for="description">
                        Descrição
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Conte um pouco sobre a empresa..."
                    ></textarea>

                </div>

            </div>


            <button
                type="button"
                class="btn btn-primary"
            >
                Criar minha conta
            </button>


            <p class="login-link">

                Já possui uma conta?

                <a href="./index.html">
                    Entrar
                </a>

            </p>


        </form>

    </section>

</main>

</body>
</html>
