<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Linketinder | Candidato</title>

<link rel="stylesheet" href="../css/style.css">


</head>

<body>

<header class="navbar">

    <div class="brand-logo">
    <span>Link</span><strong>etinder</strong>
</div>

<nav>
    <a href="./candidato.html" class="active">Vagas</a>
    <a href="#">Meu perfil</a>
</nav>

<div class="user-menu">
    <div class="avatar" id="user-avatar">
        ??
    </div>

    <span id="user-name">
        Nome do candidato
    </span>
</div>

</header>

<main class="page-container">


<section class="profile-header">

    <div class="profile-avatar large" id="profile-avatar">
        ??
    </div>

    <div class="profile-info">

        <span class="profile-type">
            CANDIDATO
        </span>

        <h1 id="profile-name">
            Nome do candidato
        </h1>

        <p id="profile-description">
            Descrição do candidato
        </p>

        <div class="skills" id="profile-skills">

            <!--
                As competências serão adicionadas
                dinamicamente pelo TypeScript.
            -->

        </div>

    </div>

</section>


<section class="content-header">

    <div>
        <span class="section-label">
            OPORTUNIDADES
        </span>

        <h2>
            Vagas disponíveis
        </h2>
    </div>

    <span class="result-count" id="result-count">
        0 vagas encontradas
    </span>

</section>


<section class="job-grid" id="job-grid">

    <!--
        As vagas serão adicionadas dinamicamente
        pelo TypeScript.
    -->

</section>


</main>
<script src="../js/bundle.js"></script>
</body>
</html>
