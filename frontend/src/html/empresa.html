<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Linketinder | Empresa</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="navbar">

<div class="brand-logo">
    <span>Link</span><strong>etinder</strong>
</div>

<nav>
    <a href="./empresa.html" class="active">Dashboard</a>
    <a href="#">Minhas vagas</a>
    <a href="#">Candidatos</a>
</nav>

<div class="user-menu">

    <div class="avatar company-avatar" id="user-avatar">
        ?
    </div>

    <span id="user-name">
        ?
    </span>

</div>

</header>

<main class="page-container">

<!-- PERFIL DA EMPRESA -->

<section class="profile-header company-profile">

    <div class="profile-avatar large company-avatar" id="profile-avatar">
        ?
    </div>

    <div class="profile-info">

        <span class="profile-type company">
            EMPRESA
        </span>

        <h1 id="profile-name">
            ?
        </h1>

        <p id="profile-description">
            ?
        </p>

    </div>

</section>


<section class="dashboard-grid">


    <!-- CRIAR VAGA -->

    <article class="dashboard-card create-job">

        <div class="card-header">

            <div>
                <span class="section-label">
                    OPORTUNIDADE
                </span>

                <h2>Criar nova vaga</h2>

            </div>

            <span class="plus-icon">+</span>

        </div>


        <form>

            <div class="input-group">

                <label for="job-title">
                    Título da vaga
                </label>

                <input
                    type="text"
                    placeholder="Desenvolvedor Java"
                    id="job-title"
                >

            </div>


            <div class="input-row">

                <div class="input-group">

                    <label for="job-type">
                        Tipo
                    </label>

                    <select id="job-type">

                        <option value="CLT">CLT</option>
                        <option value="PJ">PJ</option>
                        <option value="ESTÁGIO">Estágio</option>

                    </select>

                </div>


                <div class="input-group">

                    <label for="job-location">
                        Localização
                    </label>

                    <input
                        type="text"
                        id="job-location"
                        placeholder="São Paulo"
                    >

                </div>

            </div>


            <div class="input-group">

                <label for="skills">
                    Competências
                </label>

                <input
                    type="text"
                    id="skills"
                    placeholder="Java, Python, Spring"
                >

            </div>


            <div class="input-group">

                <label for="job-description">
                    Descrição
                </label>

                <textarea
                    id="job-description"
                    rows="4"
                ></textarea>

            </div>


            <button
                type="button"
                class="btn btn-primary"
                id="criar-vaga"
            >
                Publicar vaga
            </button>

        </form>

    </article>


    <!-- GRÁFICO -->

    <article class="dashboard-card">

        <div class="card-header">

            <div>

                <span class="section-label">
                    TALENTOS
                </span>

                <h2>Candidatos por competência</h2>

            </div>

        </div>


        <div class="chart">

            <canvas id="competencia-chart"></canvas>

        </div>

    </article>

</section>


<!-- MINHAS VAGAS -->

<section class="section">

    <div class="content-header">

        <div>

            <span class="section-label">
                MINHAS VAGAS
            </span>

            <h2>Vagas cadastradas</h2>

        </div>

    </div>


    <div class="job-list" id="job-list">


        <!-- MODELO DE UMA VAGA -->

    </div>

</section>


<!-- CANDIDATOS -->

<section class="section">

    <div class="content-header">

        <div>

            <span class="section-label">
                TALENTOS
            </span>

            <h2>Candidatos disponíveis</h2>

        </div>

        <span class="result-count" id="candidate-count">
            0 candidatos
        </span>

    </div>


    <div class="candidate-grid" id="candidate-grid">


        <!-- MODELO DE UM CANDIDATO -->

        <article class="candidate-card" id="candidate-card">

            <div class="candidate-top">


                <span class="anonymous">
                    PERFIL ANÔNIMO
                </span>

            </div>


            <h3 id="candidate-name">
                ?
            </h3>


            <div class="candidate-section">

                <span>FORMAÇÃO</span>

                <p id="candidate-education">
                    ?
                </p>

            </div>


            <div class="candidate-section">

                <span>COMPETÊNCIAS</span>

                <div class="skills" id="candidate-skills">

                    <span class="skill">
                        ?
                    </span>

                    <span class="skill">
                        ?
                    </span>

                </div>

            </div>


            <!-- VAGA À QUAL O CANDIDATO SE CANDIDATOU -->

            <div class="candidate-section">

                <span>VAGA</span>

                <p id="candidate-job">
                    ?
                </p>

            </div>


            <div class="candidate-footer">

                <button
                    class="btn-like"
                    id="candidate-like"
                >
                    ♥
                </button>

            </div>

        </article>


    </div>

</section>
</main>

<script src="../js/bundle.js"></script>

</body>
</html>
