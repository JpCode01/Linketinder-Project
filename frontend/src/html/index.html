<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Linketinder | Login</title>

<link rel="stylesheet" href="../css/style.css">
```

</head>

<body class="auth-page">

```
<main class="auth-container">

    <section class="auth-brand">

        <div class="brand-logo">
            <span>Link</span><strong>etinder</strong>
        </div>

        <h1>
            Conectando talentos<br>
            <span>às melhores oportunidades.</span>
        </h1>

        <p>
            Uma plataforma que aproxima candidatos e empresas
            através de suas competências.
        </p>

    </section>


    <section class="auth-card">

        <div class="card-header">

            <h2>Bem-vindo ao Linketinder</h2>

            <p>
                Entre para continuar ou crie seu cadastro.
            </p>

        </div>


        <form>

            <div class="input-group">

                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

            </div>


            <div class="input-group">

                <label>Entrar como</label>

                <div class="register-buttons">

                    <button
                        type="button"
                        id="login-candidato"
                        class="btn btn-outline"
                    >
                        Candidato
                    </button>

                    <button
                        type="button"
                        id="login-empresa"
                        class="btn btn-outline red"
                    >
                        Empresa
                    </button>

                </div>

            </div>

        </form>


        <div class="divider">
            <span>ou</span>
        </div>


        <div class="register-section">

            <p>Ainda não possui uma conta?</p>

            <div class="register-buttons">

                    <button
                        type="button"
                        id="cadastrar-candidato"
                        class="btn btn-outline"
                    >
                        Candidato
                    </button>

                    <button
                        type="button"
                        id="cadastrar-empresa"
                        class="btn btn-outline red"
                    >
                        Empresa
                    </button>

            </div>

        </div>

    </section>

</main>
```
<script src="../js/bundle.js"></script>
</body>
</html>
