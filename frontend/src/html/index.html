<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Linketinder | Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-brand">
            <div class="brand-logo">
                <span>Link</span><strong>etinder</strong>
            </div>

            <h1>
                Conectando talentos<br>
                <span>às melhores oportunidades.</span>
            </h1>

            <p>
                Uma plataforma que aproxima candidatos e empresas
                através de suas competências.
            </p>
        </section>


        <section class="auth-card">

            <div class="card-header">
                <h2>Bem-vindo de volta</h2>
                <p>Entre na sua conta para continuar.</p>
            </div>

            <form>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                    >
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                    >
                </div>

                <button
                    type="button"
                    class="btn btn-primary"
                >
                    Entrar
                </button>

            </form>


            <div class="divider">
                <span>ou</span>
            </div>


            <div class="register-section">

                <p>Ainda não possui uma conta?</p>

                <div class="register-buttons">

                    <a
                        href="./cadastro.html?tipo=candidato"
                        class="btn btn-outline"
                    >
                        Sou candidato
                    </a>

                    <a
                        href="./cadastro.html?tipo=empresa"
                        class="btn btn-outline red"
                    >
                        Sou empresa
                    </a>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
